# 稳定性评分模型
# ---------------------------------------------------------------
# 设计主张：**评分由规则可解释地算出**，不交给大模型拍脑袋。
# 理由有三：
#   1. 可复现——同一份数据必须得到同一个分数，否则「多次巡检对比」毫无意义；
#   2. 可解释——报告里能逐项列出「这 12 分扣在哪」，而不是一个神秘数字；
#   3. 抗幻觉——LLM 对数值的直觉并不可靠，微调 ±5 分是它能承担的最大责任。
#
# 子项权重合计 100，扣分按「超阈幅度 × 影响面占比」计算，各子项扣满即止。

dimensions:
  - key: availability
    name: 可用性
    weight: 40
    description: 对照 SLO 换算错误预算消耗率，成功率与业务错误率双口径
  - key: performance
    name: 性能
    weight: 25
    description: P95/P99 超阈幅度 × 受影响接口占比，并计入响应抖动
  - key: resource
    name: 资源
    weight: 20
    description: CPU / 内存 / 连接数超阈的实例占比与超阈幅度
  - key: stability
    name: 稳定性
    weight: 15
    description: 错误率波动、单实例离群（同类实例间不均衡）

# 封顶规则：单条 P1 的存在本身就意味着「不是小问题」，不允许被其他项的高分掩盖。
# 按顺序匹配，首个命中生效。
caps:
  - condition: has_p1
    max: 60
    reason: 存在紧急（P1）异常，稳定性评分封顶 60
  - condition: p1_on_critical
    max: 45
    reason: 紧急（P1）异常命中核心链路服务，故障会直接放大到用户侧，封顶 45
  - condition: p1_count_ge:2
    max: 55
    reason: 同时存在 2 个及以上紧急（P1）异常，说明故障面扩散，封顶 55

ai_adjust_limit: 5
