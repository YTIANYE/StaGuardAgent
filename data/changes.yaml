# 变更事件（模拟发布 / 配置变更记录）
# ===============================================================
# 这是 AI 归因里最有价值的一类证据：异常起始时间与变更时间高度重合时，
# 「变更引入」几乎是唯一说得通的解释。
#
# `minutes_before_end` 是相对巡检窗口结束时刻的偏移（负数表示在窗口之前）。
#
# 条目**不带 `scenario` 字段**的是背景变更：对所有场景都可见，是刻意的干扰项。
# 带 `scenario` 的条目只在对应场景生效（S4 的关键证据、S1/S3 的干扰项）。
# 没有干扰项的归因题目等于送分题；只有存在「时间上接近但因果无关」的变更，
# 才能检验 AI 是否真的在做因果推理，而不是「看到变更就说变更引入」。
#
# 评测时会给这个区分打两个分：
#   命中率（S4 是否识别为变更引入）+ 误报率（其它场景是否乱怪变更）。

changes:
