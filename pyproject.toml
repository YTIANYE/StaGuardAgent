[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staguard"
version = "0.1.0"
description = "StaGuardAgent - AI 驱动的业务稳定性自动化巡检 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "openai>=1.35",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
staguard = "staguard.cli:app"

[tool.setuptools.packages.find]
include = ["staguard*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: 需要生成完整模拟数据集并跑通端到端链路的测试（约 30s，用 -m 'not slow' 跳过）",
]
